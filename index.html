<!doctype html>
<html lang="ro" class="standalone-host">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Caiet: aplicația care îți explică lecțiile pe înțelesul tău, cu ajutorul AI. Prototip interactiv.">
<meta name="theme-color" content="#EDF0F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caiet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Caiet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: one iPhone-sized app (390×844). On a phone it fills the screen; on a laptop it sits inside a drawn iPhone on notebook-grid paper. */
:root{
  color-scheme: light;
  --ink:#14161F; --muted:#4a5068; --soft:#6a7186; --pix:#2447D6; --pix2:#5C78FF;
  --coral:#FF6B4A; --coral-d:#D84A2A; --butter:#FFD66E; --gold:#F2B530; --mint:#2FBF94; --mint-d:#1d8a68;
  --paper:#FFFFFF; --grid:rgba(36,71,214,.07); --line:rgba(20,22,31,.08);
  --f-ui:"Inter", -apple-system, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --sat:0px; --sab:0px; --top:58px; --bot:30px;
  --ease:cubic-bezier(.32,.72,0,1);
}
html.standalone-host{ --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px) }
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--pix);outline-offset:2px}
svg{display:block}

/* ---------- stage (desktop: drawn phone on grid paper) ---------- */
#stage{position:relative;height:100%;width:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-inline:16px;
  background:
    radial-gradient(40% 50% at 70% 25%, rgba(92,120,255,.18), transparent 70%),
    radial-gradient(35% 45% at 85% 75%, rgba(255,138,107,.16), transparent 70%),
    radial-gradient(40% 40% at 50% 100%, rgba(255,214,110,.20), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/22px 22px, var(--paper)}
#side{display:none;max-width:340px;flex-direction:column;gap:18px}
.framed #side.show{display:flex}
#side .word{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:1}
#side .word b{color:var(--gold)}
#side p{margin:0;font-size:16px;line-height:1.5;color:var(--muted);text-wrap:pretty}
#side .lbl2{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--pix);text-transform:uppercase}
#side .row{display:flex;gap:10px;flex-wrap:wrap}
.sbtn{height:44px;padding:0 18px;border-radius:999px;font-weight:600;font-size:15px;background:var(--ink);color:#fff}
.sbtn.ghost{background:rgba(255,255,255,.7);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
#side .hand{font-family:var(--f-hand);font-size:30px;color:var(--pix);transform:rotate(-2deg);line-height:1.05}

#device{position:relative;flex:none}
.framed #device{width:412px;height:866px;border-radius:64px;padding:4px;transform:scale(var(--scale,1));transform-origin:center;
  background:linear-gradient(150deg,#f4f5f7 0%,#b9bdc5 16%,#eef0f3 34%,#9ca0a9 58%,#e6e8eb 78%,#aeb2b9 100%);
  box-shadow:0 60px 70px -30px rgba(16,22,52,.45),0 28px 40px -18px rgba(16,22,52,.30),0 2px 3px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.65)}
.framed #bezel{width:100%;height:100%;border-radius:60px;background:#07080a;padding:7px}
.framed #app{width:390px;height:844px;border-radius:53px}
#app{position:relative;overflow:hidden;isolation:isolate;background:#EDF0F8}
.phone-ui #stage{padding:0;display:block;background:#EDF0F8}
.phone-ui #device,.phone-ui #bezel,.phone-ui #app{width:100%;height:100%}
.phone-ui{--top:calc(var(--sat) + 12px);--bot:calc(var(--sab) + 16px)}
.dbtn{display:none}
.framed .dbtn{display:block;position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#8e929a,#d7d9dd)}

/* fake system chrome, only inside the drawn phone */
#sbar,#island,#homeind{display:none}
.framed #sbar{display:flex;position:absolute;top:0;left:0;right:0;height:54px;align-items:center;justify-content:space-between;padding:6px 30px 0 46px;z-index:60;font-weight:600;font-size:17px;pointer-events:none;transition:color .3s}
.framed #island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:61;pointer-events:none}
.framed #homeind{display:block;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:rgba(10,10,14,.85);z-index:61;pointer-events:none;transition:background .3s}
#app.dark #sbar{color:#fff} #app.dark #homeind{background:rgba(255,255,255,.9)}
#sbar .ic{display:flex;gap:6px;align-items:center}

/* ---------- pages ---------- */
.page{position:absolute;inset:0;overflow:hidden;background:#EDF0F8;will-change:transform}
.wall{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wall .b{position:absolute;border-radius:50%;filter:blur(46px)}
.wall .grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.pg{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding-top:var(--top)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 18px 22px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.foot{flex:none;padding:10px 18px var(--bot);display:flex;flex-direction:column;gap:10px}
.stack{display:flex;flex-direction:column}

.anim-in-r{animation:inR .46s var(--ease) both}.anim-out-l{animation:outL .46s var(--ease) both}
.anim-in-l{animation:inL .46s var(--ease) both}.anim-out-r{animation:outR .46s var(--ease) both}
.anim-in-up{animation:inUp .5s var(--ease) both}.anim-out-down{animation:outDown .42s var(--ease) both}
.anim-fade-in{animation:fadeIn .28s ease both}.anim-fade-out{animation:fadeOut .28s ease both}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outL{from{transform:none;filter:none}to{transform:translateX(-28%);filter:brightness(.85)}}
@keyframes inL{from{transform:translateX(-28%);filter:brightness(.85)}to{transform:none;filter:none}}
@keyframes outR{from{transform:none}to{transform:translateX(100%)}}
@keyframes inUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes outDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}} @keyframes fadeOut{from{opacity:1}to{opacity:0}}
.out-r,.out-down{z-index:5}

/* ---------- liquid glass ---------- */
.glass{position:relative;border-radius:26px;background:rgba(255,255,255,.30);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.9),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 18px rgba(255,255,255,.18),0 10px 28px -8px rgba(28,38,90,.22),0 1px 2px rgba(28,38,90,.08)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.15) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(165deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,0) 32%)}
.frost{background:rgba(255,255,255,.58)}
.dk{background:rgba(255,255,255,.13);box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -1px 1px rgba(255,255,255,.12),0 12px 30px -10px rgba(0,0,0,.5)}
.dk::before{background:linear-gradient(140deg,rgba(255,255,255,.6),rgba(255,255,255,.08) 40%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.35))}
.dk::after{background:linear-gradient(165deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 30%)}
.glass>*{position:relative;z-index:1}

.tap{transition:transform .18s var(--ease),opacity .18s}
.tap:active{transform:scale(.965)}
.row{display:flex;align-items:center}.between{justify-content:space-between}
.lbl{font-size:12px;font-weight:650;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.h1{font-size:34px;font-weight:700;letter-spacing:-.9px;line-height:1.05;margin:0;text-wrap:balance}
.h1.s30{font-size:30px}
.sub{font-size:15.5px;color:#3a3f4f;line-height:1.38;margin:6px 0 0}
.circle{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:650;letter-spacing:.4px;white-space:nowrap}
.cta{height:54px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -6px rgba(20,22,31,.55)}
.cta.ink{background:linear-gradient(180deg,#3358F0,#2040C8)}
.cta[disabled]{background:rgba(20,22,31,.18);box-shadow:none;color:rgba(255,255,255,.95);cursor:default}
.gbtn{height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:16px;width:100%}
.card{padding:16px;border-radius:26px}
.muted{color:var(--muted)}

/* top bar with steps */
.topbar{display:flex;align-items:center;gap:12px;padding:0 20px 0 16px;margin-bottom:14px}
.segs{flex:1;display:flex;gap:5px}.segs i{flex:1;height:6px;border-radius:3px;background:rgba(20,22,31,.12);transition:background .4s}
.segs i.on{background:var(--pix)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:12px;gap:10px}

/* chips & rows */
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:650}
.chip.on{background:var(--pix)!important;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px -8px rgba(36,71,214,.7)!important}
.chip.on::before,.chip.on::after{display:none}
.prow{height:50px;border-radius:16px;padding:0 14px 0 16px;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:15.5px;font-weight:550;text-align:left}
.prow.on{background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1.8px var(--pix),inset 0 1px 1px #fff;font-weight:650}
.radio{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.8px rgba(20,22,31,.25);flex:none}
.field{height:50px;border-radius:16px;padding:0 14px;display:flex;align-items:center;gap:10px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}
.field input::placeholder{color:#8a90a2}
.sw{width:52px;height:30px;border-radius:15px;background:rgba(20,22,31,.12);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);transition:transform .3s var(--ease)}
.sw.on{background:var(--pix)}.sw.on::after{transform:translateX(22px)}
.srow{height:52px;padding:0 12px 0 10px;display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left}
.sic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.sep{height:1px;background:rgba(20,22,31,.07);margin-left:54px}

/* options (quiz) */
.opt{min-height:52px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:16.5px;font-weight:600;width:100%;text-align:left;gap:10px}
.opt.dash{border:1.8px dashed rgba(20,22,31,.3);background:transparent;box-shadow:none;color:#3a3f4f}
.opt.dash::before,.opt.dash::after{display:none}
.opt.pick{background:rgba(36,71,214,.14);box-shadow:inset 0 0 0 1.8px var(--pix)}
.opt.good{background:rgba(47,191,148,.20);box-shadow:inset 0 0 0 1.5px rgba(47,191,148,.9),inset 0 1px 1px rgba(255,255,255,.8)}
.opt.bad{background:rgba(255,107,74,.16);box-shadow:inset 0 0 0 1.5px rgba(255,107,74,.85)}
.opt[disabled]{cursor:default}

/* tab bar */
.tabbar{position:absolute;left:16px;right:88px;bottom:calc(var(--bot) - 4px);height:64px;border-radius:34px;display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#3a3f4f;width:86px;height:54px;justify-content:center;border-radius:28px}
.tab.on{color:var(--pix);background:rgba(255,255,255,.62);box-shadow:inset 0 1px 1px #fff,0 2px 8px rgba(30,40,90,.10)}
.fab{position:absolute;right:16px;bottom:calc(var(--bot) - 4px);width:64px;height:64px;border-radius:50%;z-index:30;display:flex;align-items:center;justify-content:center}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.bub{max-width:82%;padding:11px 15px;border-radius:22px;font-size:15.5px;line-height:1.38;animation:pop .32s var(--ease) both}
.bub.ai{border-bottom-left-radius:8px;align-self:flex-start}
.bub.me{align-self:flex-end;background:linear-gradient(180deg,#3A5EF5,#2346D2);color:#fff;border-bottom-right-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px -8px rgba(36,71,214,.6)}
.formula{margin-top:9px;padding:9px 12px;border-radius:14px;background:rgba(36,71,214,.08);font-weight:650;text-align:center;font-size:16px}
.ok-line{display:flex;gap:7px;align-items:center;font-weight:650;color:var(--mint-d)}
.typing{display:flex;gap:4px;padding:14px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:#7a8095;animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchip{padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:600}
.composer{display:flex;gap:8px;align-items:center}
.composer .field{flex:1;height:52px;border-radius:999px;padding:0 8px 0 18px}
.send{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#3A5EF5,#2346D2);display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -6px rgba(36,71,214,.6)}

/* toast & sheet */
#toast{position:absolute;left:50%;top:calc(var(--top) + 4px);transform:translate(-50%,-140%);z-index:90;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;opacity:0;visibility:hidden;transition:transform .45s var(--ease),opacity .3s,visibility 0s .45s}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .45s var(--ease),opacity .2s}
.sheet-back{position:absolute;inset:0;z-index:80;background:rgba(10,12,24,.28);animation:fadeIn .25s both}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:81;border-radius:38px;padding:12px 20px calc(var(--bot) - 4px);animation:inUp .45s var(--ease) both;max-height:86%;overflow-y:auto}
.sheet.frost{background:rgba(255,255,255,.82)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(20,22,31,.18);margin:0 auto 14px}
.closing .sheet{animation:outDown .32s var(--ease) both}.closing.sheet-back{animation:fadeOut .3s both}

/* scan */
.cam{position:absolute;inset:0;background:#3a312b;overflow:hidden}
.desk{position:absolute;inset:0;background:repeating-linear-gradient(95deg,rgba(255,255,255,.03) 0 3px,rgba(0,0,0,.04) 3px 9px),linear-gradient(180deg,#5a4a3e,#2c241f)}
.paper{position:absolute;left:-8%;top:5%;width:118%;height:86%;transform:rotate(-4deg);background:#fbfbf8;box-shadow:0 30px 50px rgba(0,0,0,.45);
  background-image:linear-gradient(rgba(70,110,200,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(70,110,200,.22) 1px,transparent 1px);background-size:21px 21px;background-position:9px 6px}
.paper .hw{position:absolute;font-family:var(--f-hand);color:#1f3fc2;line-height:1;white-space:nowrap}
.vign{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 35%,rgba(255,240,220,.10),rgba(0,0,0,.45))}
#camVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.scanbox{position:absolute;left:13%;top:24.5%;width:72%;height:9.5%;border-radius:18px;transition:box-shadow .5s,background .5s}
.collage{position:relative;height:300px;flex:none}
@media (max-height:740px){.phone-ui .collage{transform:scale(.78);transform-origin:top center;margin-bottom:-66px}}
.scanbox.found{background:rgba(255,255,255,.08);box-shadow:0 0 0 2000px rgba(0,0,0,.18),0 0 30px rgba(120,160,255,.45)}
.scanline{position:absolute;left:4%;right:4%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#9db4ff,transparent);box-shadow:0 0 18px #7fa0ff;opacity:0}
.scanning .scanline{animation:scan 1.1s ease-in-out 2;opacity:1}
@keyframes scan{0%{top:5%}50%{top:90%}100%{top:5%}}
.shutter{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.shutter i{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70}
.flash.go{animation:flash .5s ease}
@keyframes flash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}

.bars{display:flex;align-items:flex-end;justify-content:space-between;height:104px;margin-top:14px;padding:0 4px}
.bars div{text-align:center;display:flex;flex-direction:column;align-items:center}
.bars span{display:block;width:28px;border-radius:9px;background:rgba(36,71,214,.22);transition:height .8s var(--ease)}
.bars small{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:6px}
.mrow{padding:10px 2px}.mtrack{height:7px;border-radius:4px;background:rgba(20,22,31,.07);margin-top:7px;overflow:hidden}
.mtrack i{display:block;height:100%;border-radius:4px;width:0;transition:width .9s var(--ease)}
.dot9{width:9px;height:9px;border-radius:50%;display:inline-block}
.float1{animation:bob 6s ease-in-out infinite}.float2{animation:bob 7s ease-in-out -2s infinite}.float3{animation:bob 6.5s ease-in-out -4s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="stage">
  <aside id="side" aria-label="Despre prototip">
    <div class="lbl2">Prototip interactiv</div>
    <div class="word">caiet<b>.</b></div>
    <p>Aplicația care îți explică lecțiile pe înțelesul tău, cu ajutorul AI. Atinge ecranul ca pe un telefon: îți faci cont, dai testul de pornire și rezolvi un exercițiu cu indicii.</p>
    <div class="row">
      <button class="sbtn tap" data-act="reset">Reia de la început</button>
      <button class="sbtn ghost tap" data-act="jumpHome">Sari la ecranul principal</button>

/* ================= navigation ================= */
const pagesEl = $("#pages"), appEl = $("#app");
let cur = null, curId = null, stack = [], busy = false;
const DARK = new Set(["scan","lock"]);
function go(id, mode = "push", arg) {
  if (busy) return;
  if (id === "diag" && (!S.diag || S.diag.done)) S.diag = { i:0, res:[], done:false };
  const el = document.createElement("section");
  el.className = "page"; el.dataset.id = id;
  if (id === "scan" || id === "lock") el.style.background = "#000";
  el.innerHTML = P[id](arg);
  pagesEl.appendChild(el);
  appEl.classList.toggle("dark", DARK.has(id));
  const old = cur;
  if (mode === "push" && curId) stack.push(curId);
  if (mode === "up" && curId) stack.push(curId);
  const pairs = { push:["anim-in-r","anim-out-l"], pop:["anim-in-l","anim-out-r"], up:["anim-in-up",""], down:["","anim-out-down"], fade:["anim-fade-in","anim-fade-out"], none:["",""] }[mode] || ["",""];
  if (old) {
    busy = true;
    if (mode === "pop" || mode === "down") { pagesEl.appendChild(old); old.classList.add(mode === "pop" ? "out-r" : "out-down"); }
    if (pairs[0]) el.classList.add(pairs[0]);
    if (pairs[1]) old.classList.add(pairs[1]);
    setTimeout(() => { old.remove(); el.classList.remove(...pairs.filter(Boolean)); busy = false; }, pairs[0] || pairs[1] ? 470 : 0);
  }
  cur = el; curId = id;
  mount(id, el, arg);
  save();
}
function back() {
  if (curId === "scan") stopCam();
  const prev = stack.pop();
  if (!prev) return;
  const mode = (curId === "scan" || curId === "lock") ? "down" : "pop";
  go(prev, mode);
}
function rerender() {
  if (!cur) return;
  const sc = cur.querySelector(".scroll"); const top = sc ? sc.scrollTop : 0;
  cur.innerHTML = P[curId]();
  const sc2 = cur.querySelector(".scroll"); if (sc2) sc2.scrollTop = top;
  mount(curId, cur, null, true);
  save();
}
function mount(id, el, arg, re) {
  requestAnimationFrame(() => setTimeout(() => {
    el.querySelectorAll("[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
    el.querySelectorAll("[data-h]").forEach(b => b.style.height = b.dataset.h + "px");
  }, re ? 0 : 120));
  if (id === "code") { if (!re) { code = ""; startResend(); } drawCode(); }

}

    await ai(`Metoda pe scurt, pentru ax² + bx + c = 0:<br>1. Afli a, b și c.<br>2. Calculezi Δ = b² − 4ac.<br>3. Dacă Δ ≥ 0, aplici formula:<div class="formula">x<sub style="font-size:10px">1,2</sub> = (−b ± √Δ) / 2a</div>`, 700);
    await ai("Vrei să-l rezolvi tu acum, cu indicii? Eu doar întreb.", 500);
    chips([["Da, hai","start"],["Mai târziu","later"]]); C.wait = "method"; placeholder("Scrie „da” ca să începem…");
    return;
  }
  await ai("Hai să-l rezolvăm împreună. Eu întreb, tu răspunzi.", 500);

}

}

const nums = (s) => (s.replace(/[−–]/g, "-").replace(/[₁₂]/g, "").match(/-?\d+(\.\d+)?/g) || []).map(Number);
async function handle(input, fromChip) {
  if (!C || C.busy) return;
  const txt = input.trim(); if (!txt) return;
  C.busy = true;
  try {
    const low = txt.toLowerCase();
    const label = fromChip ? fromChip : txt;
    addMsg("me", esc(label));
    if (input === "hint") return await hint();
    if (input === "whatDelta" || /ce e (Δ|delta)|nu înțeleg ce|nu inteleg ce/.test(low)) {
      await ai("Δ (delta) e un număr care îți spune câte soluții are ecuația: dacă e pozitiv, două; dacă e 0, una; dacă e negativ, niciuna. Se calculează cu Δ = b² − 4ac.", 800);
      if (C.wait === "deltaF") { C.wait = "deltaV"; await ai("Acum pune numerele: a = 1, b = −5, c = 6. Cât îți iese?", 500); return askDeltaVal(); }
      return;
    }
    if (input === "home") { go("home", "fade"); stack = []; return; }
    if (input === "cards") { go("cards"); return; }
    if (C.wait === "method") {
      if (input === "start" || /^da|hai|ok/.test(low)) { C.mode = "hint"; await ai("Super. Hai pas cu pas.", 400); return askABC(); }
      if (input === "later") { await ai("Bine. Îl găsești în „Azi” când vrei să revii.", 500); chips([["Înapoi la Azi","home"]]); return; }
      return;
    }
    if (C.wait === "abc") {
      const n = nums(txt);
      const ok = input === "abc_ok" || (n.length >= 3 && n[0] === 1 && n[1] === -5 && n[2] === 6);
      if (ok) { await ai(OK("Bun: a = 1, b = −5, c = 6."), 500); return askDelta(); }
      if (input === "abc_idk" || /nu știu|nu stiu/.test(low)) { await ai("a e numărul din fața lui x², b cel din fața lui x, iar c e termenul liber. Aici: a = 1, b = −5, c = 6.", 800); C.mistakes++; return askDelta(); }
      C.mistakes++;
      await ai("Aproape. Uită-te la semnul din fața lui 5x: e minus, deci b = −5. Restul e bine.", 700);
      return askDelta();
    }
    if (C.wait === "deltaF") {
      if (input === "df_ok" || /b\s*(²|\^?2)\s*[-−]\s*4\s*a\s*c/.test(low)) { await ai("Da. Pune numerele și spune-mi ce îți iese.", 500); return askDeltaVal(); }
      if (input === "df_hint") { await ai("Formula e Δ = b² − 4ac. Pune numerele și spune-mi ce îți iese.", 600); C.mistakes++; return askDeltaVal(); }
      const n = nums(txt); if (n.length) { C.wait = "deltaV"; return await checkDelta(n); }
      await ai("Formula e Δ = b² − 4ac. Încearcă acum cu numerele noastre.", 600); return askDeltaVal();
    }
    if (C.wait === "deltaV") { const n = nums(txt); if (!n.length) { await ai("Scrie doar numărul pe care îl obții pentru Δ.", 500); return; } return await checkDelta(n); }
    if (C.wait === "roots") {
      const n = nums(txt).filter(v => !Number.isNaN(v));
      const set = new Set(n);
      if (set.has(2) && set.has(3)) return finishChat();
      if (set.has(2) || set.has(3)) { C.mistakes++; await ai(`${set.has(2) ? "x = 2" : "x = 3"} e bună. Și cealaltă? Folosește acum semnul ${set.has(2) ? "plus" : "minus"}.`, 600); return; }
      C.mistakes++; await ai("Nu chiar. −b = 5 și √Δ = 1. Deci (5 + 1) / 2 și (5 − 1) / 2. Cât fac?", 700); return;
    }
    if (C.wait === "done") { await ai("Dacă vrei încă un exercițiu, apasă pe butonul cu camera din „Azi”.", 500); chips([["Înapoi la Azi","home"],["Vezi cartonașele","cards"]]); return; }
  } finally { C && (C.busy = false); }
}
async function checkDelta(n) {
  let v = n[n.length - 1];
  if (n.length === 2 && n[0] === 25 && n[1] === -24) { await ai("Exact asta e scăderea. Și cât face?", 500); return; }
  if (v === 1) { await ai(OK("Corect."), 450); return askRoots(); }
  C.mistakes++;
  if (v === 49) await ai("Atenție la semn: −4 · 1 · 6 = −24. Deci 25 − 24. Cât face?", 700);
  else await ai("Ia-o pe bucăți: b² = (−5)² = 25 și 4ac = 4 · 1 · 6 = 24. Cât face 25 − 24?", 700);
}
async function hint() {
  C.mistakes++;
  const h = { abc:"Ecuația are forma ax² + bx + c = 0. Uită-te ce număr stă în fața lui x², ce număr în fața lui x (cu tot cu semn) și ce rămâne singur.",
    deltaF:"Δ = b² − 4ac. Îl folosești ca să afli câte soluții are ecuația.",
    deltaV:"b² = (−5)² = 25. Apoi 4 · a · c = 4 · 1 · 6 = 24. Scade-le.",
    roots:"Pune numerele în formulă: x = (5 ± 1) / 2. O dată cu plus, o dată cu minus.",
    method:"Scrie „da” și te iau pas cu pas.", done:"Ai terminat exercițiul." }[C.wait] || "Încearcă pas cu pas.";
  await ai(h, 600);
}

/* ================= fit the drawn phone ================= */
const IS_PHONE = (() => {
  const ua = navigator.userAgent || "";
  const uaPhone = /iPhone|iPod|Android.*Mobile|Mobile.*Firefox|Windows Phone/i.test(ua);
  const small = Math.min(screen.width || 9999, screen.height || 9999) <= 600;
  const touch = (navigator.maxTouchPoints || 0) > 0 || "ontouchstart" in window;
  return uaPhone || (touch && small);
})();
function fit() {
  const framed = !IS_PHONE && window.innerWidth >= 640 && window.innerHeight >= 600;
  document.body.classList.toggle("framed", framed);
  document.body.classList.toggle("phone-ui", !framed);
  const side = $("#side"); side.classList.toggle("show", framed && window.innerWidth >= 1000);
  if (framed) {
    const sc = Math.min(1, (window.innerHeight - 40) / 866, (window.innerWidth - (window.innerWidth >= 1000 ? 460 : 40)) / 412);
    const dev = $("#device"); dev.style.setProperty("--scale", sc.toFixed(3));
    dev.style.margin = `${-(866 * (1 - sc)) / 2}px ${-(412 * (1 - sc)) / 2}px`;
  } else { $("#device").style.margin = "0"; }
}
